<!DOCTYPE html>
<html lang="pt=br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem Livros</title>
    <link rel="stylesheet" href="listagem_livros.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="shortcut icon" href="../../imgs/Icone - Bibliotec.png" type="image/x-icon">
    <script src="https://kit.fontawesome.com/b2ed7bc9ad.js" crossorigin="anonymous"></script>

</head>

<body class="pagina-listagem">
    <aside class="menu-lateral">
        <div class="topo-menu">
            <button class="btn-voltar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <img class="logo" src="../../imgs/Logo Vertical - clara.svg" alt="Logo vertical do bibliotec">
        </div>
        <nav class="menu-navegacao">
            <a href="#" class="item-menu">
                <i class="fa-solid fa-user"></i>
                <span>Perfil</span>
            </a>
            <a href="#" class="item-menu">
                <i class="fa-solid fa-user-plus"></i>
                <span>Cadastrar usuario</span>
            </a>

            <a href="#" class="item-menu">
                <i class="fa-solid fa-users"></i>
                <span>Listar Usuarios</span>
            </a>
            <a href="#" class="item-menu">
                <i class="fa-solid fa-book-medical"></i>
                <span>Cadastrar livros</span>
            </a>
            <a href="#" class="item-menu ativo">
                <i class="fa-solid fa-book-bookmark"></i>
                <span>Listar Livros</span>
            </a>
            <a href="#" class="item-menu">
                <i class="fa-solid fa-address-book"></i>
                <span>Livros reservados</span>
            </a>
        </nav>

        <!-- Sair -->

        <a href="../../login/login.html" class="btn-sair">
            <i class="fa-solid fa-person-through-window"></i>
            <span>Sair</span>
        </a>
    </aside>
    <main class="conteudo-listagem">
        <section class="cabecalho-pagina">
            <h1>Listar livros</h1>
            <p>gerencie e acompanhe os livros cadastrados</p>
        </section>

        <!-- Card principal -->

        <section class="card-listagem">
            <div class="area-busca">
                <div class="campo-busca">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar livro por nome...">
                </div>

                <button class="btn-filtro">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Filtros</span>
                </button>
            </div>

            <div class="cabecalho-lista">
                <h2>Nome</h2>
                <h2>Reservado</h2>
                <h2>Categoria</h2>
                <h2>Editar</h2>
                <h2>Detalhes</h2>
            </div>
            
        </section>
    </main>
</body>

</html>
